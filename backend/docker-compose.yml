version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lib_le_lib_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1832"
      POSTGRES_DB: lib_le_lib
    ports:
      - "5555:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
